<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surfer — China Trends</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--mut:#78716c;--card:#fff;--bd:#e7e5e4;--acc:#dc2626;--ok:#16a34a;--warn:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#0c0a09;--fg:#f5f5f4;--mut:#a8a29e;--card:#1c1917;--bd:#292524}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px}
button,select{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
button.on{border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.t{font-weight:600}.m{color:var(--mut);font-size:13px}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:6px;padding:0 6px;font-size:12px;margin-right:4px}
.Verified,.Supported{color:var(--ok)}.Estimated{color:var(--warn)}.Insufficient{color:var(--mut)}
.up{color:var(--ok)}.down{color:var(--acc)}
.src{display:flex;gap:12px;flex-wrap:wrap}.src div{border:1px solid var(--bd);border-radius:8px;padding:6px 10px;background:var(--card)}
.bad{border-color:var(--acc)!important}
a{color:inherit}
</style></head><body><main>
<header><h1>Surfer · China Trends</h1>
<div class="bar">
 <button data-v="all" class="on">Tutti</button><button data-v="cross">Multi-piattaforma</button>
 <select id="hrs"><option value="6">6 ore</option><option value="24" selected>24 ore</option><option value="168">7 giorni</option></select>
 <button id="collect">Raccogli ora</button>
 <label class="m"><input type="file" id="file" hidden>Importa CSV/JSON <button id="imp" type="button">…</button></label>
 <a href="/api/export.csv">CSV</a> · <a href="/api/export.json">JSON</a>
</div></header>
<div id="health" class="src"></div>
<div id="list"></div>
<p class="m">Classifiche, non volumi di ricerca. Un trend appare solo dopo almeno 3 rilevazioni.
 Verified = raccolto automaticamente · Estimated = importato o poche osservazioni.</p>
</main>
<script>
let view="all";const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function spark(s){if(s.length<2)return"";const w=110,h=28,m=Math.max(...s.map(p=>p.strength),1);
 const pts=s.map((p,i)=>`${(i/(s.length-1)*w).toFixed(1)},${(h-p.strength/m*h).toFixed(1)}`).join(" ");
 return `<svg width="${w}" height="${h}"><polyline fill="none" stroke="currentColor" stroke-width="1.5" points="${pts}"/></svg>`}
const arrow={rising:'<span class="up">▲ in crescita</span>',falling:'<span class="down">▼ in calo</span>',stable:"● stabile"};
async function load(){
 const hrs=$("#hrs").value;
 const h=await (await fetch("/api/health")).json();
 $("#health").innerHTML=h.sources.map(s=>`<div class="${s.oks?'':'bad'}"><b>${esc(s.platform)}</b>
  <span class="m">${s.oks?"ok "+esc((s.last_ok||"").slice(5,16)):"non raggiungibile"}</span>
  ${s.last_error&&s.last_try!==s.last_ok?`<div class="m" title="${esc(s.last_error)}">ultimo errore</div>`:""}</div>`).join("")
  +(h.proxy?'<div class="m">proxy attivo</div>':"");
 const d=await (await fetch(view==="cross"?`/api/cross?hours=${hrs}`:`/api/topics?hours=${hrs}`)).json();
 $("#list").innerHTML=d.length?d.slice(0,100).map(t=>`<div class="card">
  <div><span class="t">${t.url?`<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.topic)}</a>`:esc(t.topic)}</span><br>
   ${t.platforms.map(p=>`<span class="tag">${esc(p)}</span>`).join("")}
   <span class="m">${t.observations} rilevazioni · miglior posizione ${t.best_rank??"–"}</span></div>
  <div style="text-align:right">${spark(t.series)}<br><span class="m">${t.direction?arrow[t.direction]:"dati insufficienti per un trend"}</span>
   · <span class="${t.reliability} m">${t.reliability}</span></div></div>`).join("")
  :'<p class="m">Nessun dato. Premi «Raccogli ora» o importa un file.</p>';
}
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;
 document.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("on",x===b));load()});
$("#hrs").onchange=load;
$("#collect").onclick=async e=>{e.target.disabled=true;e.target.textContent="Raccolta…";
 await fetch("/api/collect",{method:"POST"});e.target.disabled=false;e.target.textContent="Raccogli ora";load()};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{const f=e.target.files[0];if(!f)return;
 const p=prompt("Piattaforma (es. rednote, wechat) se non è nel file:","")||"";
 const fd=new FormData();fd.append("file",f);fd.append("platform",p);
 const r=await (await fetch("/api/import",{method:"POST",body:fd})).json();alert("Importate "+r.imported+" righe");load()};
load();setInterval(load,60000);
</script></body></html>
