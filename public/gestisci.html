<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Surfer · Live · La tua gara</title>
<link rel="icon" href="/logo-mark.svg">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/colors_and_type.css">
<link rel="stylesheet" href="/css/app.css">
<style>
main{max-width:680px;margin:0 auto;padding:16px 16px 64px}
h1{font-size:1.5rem;font-weight:500;margin:8px 0 4px}
h2{font-size:1.15rem;font-weight:500;margin:0 0 8px}
b,strong{font-weight:600}
.card{margin:16px 0;padding:16px}
.secret{word-break:break-all;background:var(--wt-panel);padding:8px;border-radius:8px;font-family:var(--wt-font-mono);font-size:12px;margin:8px 0}
#msg{position:sticky;top:8px;z-index:5;padding:8px 12px;border-radius:8px;display:none;margin:8px 0;background:var(--wt-card);border:1px solid var(--wt-border);border-left-width:4px}
#msg.ok{display:block;border-left-color:var(--wt-ok)}#msg.err{display:block;border-left-color:var(--wt-error)}
.keynote{background:var(--wt-panel);border:1px solid var(--wt-border);border-radius:8px;padding:12px;margin:12px 0}
.steps{display:flex;gap:8px;margin:16px 0 8px;padding:0;list-style:none}
.steps li{flex:1;text-align:center;font-size:.8rem;color:var(--wt-muted);border-top:3px solid var(--wt-border);padding-top:8px}
.steps li.done{border-color:var(--wt-teal-700);color:var(--wt-ink)}
.steps li.on{border-color:var(--wt-teal);color:var(--wt-ink);font-weight:600}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.qr{width:200px;max-width:100%;background:#fff;padding:8px;border-radius:12px;margin:12px 0}
.qr svg{display:block;width:100%;height:auto}
.tabs{display:flex;gap:8px;margin:8px 0}
.tabs button[aria-pressed=true]{background:var(--wt-teal);border-color:var(--wt-teal);color:var(--wt-teal-deep);font-weight:600}
ol.how{padding-left:20px;margin:8px 0;line-height:1.6}
.sig{font-size:.9rem}.sig.ok{color:var(--wt-ok)}.sig.wait{color:var(--wt-muted)}.sig.old{color:var(--wt-warn)}
.rn{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:40px;margin:4px 0}
.rn .end{margin-left:auto}
.list{margin:0;padding:0;list-style:none}
.list .rn{border-top:1px solid var(--wt-border);padding:4px 0;margin:0}.list .rn:first-child{border-top:0}
.check{list-style:none;padding:0;margin:8px 0;line-height:1.8}
.check li{display:flex;gap:8px}.check .ic{width:16px;flex:none;text-align:center;color:var(--wt-muted)}.check .ic.ok{color:var(--wt-teal)}
details.card>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h2{margin:0}
details.card>summary::after{content:"Mostra";font-size:var(--wt-size-small);color:var(--wt-teal)}
details.card[open]>summary::after{content:"Nascondi"}
details.card[open]>summary{margin-bottom:8px}
.linkbtn{background:none;border:0;padding:0;min-height:auto;color:var(--wt-muted);text-decoration:underline;font-size:var(--wt-size-small)}
.linkbtn:hover{color:var(--wt-error)}
.danger-zone{margin:32px 0 0;text-align:center}
</style>
</head>
<body><main>
<div id="msg" role="status"></div>
<div id="app"><p class="muted">Caricamento…</p></div>
<script src="/lib/qrcode/qrcode.js"></script>
<script type="module" src="/js/gestisci.js"></script>
</main></body></html>
