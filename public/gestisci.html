<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Surfer · Live · La tua gara</title>
<link rel="icon" href="/logo-surfer.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/colors_and_type.css">
<link rel="stylesheet" href="/css/app.css">
<style>
main{max-width:560px;margin:0 auto;padding:32px 20px 96px;text-align:center}
h1{font-size:1.7rem;margin:16px 0 6px}h2{font-size:1.25rem;margin:0 0 12px}
.card{margin:32px 0;padding:28px 22px}
.card p{margin:10px 0}
.row,.rn,.tabs{justify-content:center}
.row{gap:12px}
.secret{word-break:break-all;background:var(--wt-panel);padding:8px;border-radius:8px;font-family:var(--wt-font-mono);font-size:12px;margin:6px 0}
#msg{position:sticky;top:0;z-index:5;padding:8px 12px;border-radius:8px;display:none;margin:8px 0}
#msg.err{display:block;background:var(--wt-error);color:#1a0000}#msg.ok{display:block;background:var(--wt-ok);color:#001a08}
.keynote{background:var(--wt-panel);border:1px solid var(--wt-border);border-radius:14px;padding:18px 16px;margin:22px 0}
.steps{display:flex;gap:8px;margin:36px 0 8px;padding:0;list-style:none}
.steps li{flex:1;text-align:center;font-size:.8rem;color:var(--wt-muted);border-top:3px solid var(--wt-border);padding-top:6px}
.steps li.on{color:var(--wt-ink);border-color:var(--wt-teal,#2bb7da);font-weight:600}
.steps li.done{border-color:var(--wt-ok);color:var(--wt-ink)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:36px}
.qr{width:210px;max-width:100%;background:#fff;padding:10px;border-radius:14px;margin:20px auto}
.qr svg{display:block;width:100%;height:auto}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button[aria-pressed=true]{background:var(--wt-teal-tint);border-color:var(--wt-teal,#2bb7da)}
ol.how{list-style:none;padding:0;margin:14px 0;line-height:1.5;counter-reset:s}
ol.how li{margin:12px 0}ol.how li::before{counter-increment:s;content:counter(s) " · ";color:var(--wt-teal,#2bb7da);font-weight:600}
#ready{margin:6px 0}
.sig{font-size:.9rem}.sig.ok{color:var(--wt-ok)}.sig.wait{color:var(--wt-muted)}.sig.old{color:var(--wt-warn)}
.rn{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.secret{text-align:center;margin:14px 0}
details{margin-top:18px}
</style>
</head>
<body><main>
<div id="msg" role="status"></div>
<div id="app"><p class="muted">Caricamento…</p></div>
<script src="/lib/qrcode/qrcode.js"></script>
<script type="module" src="/js/gestisci.js"></script>
</main></body></html>
