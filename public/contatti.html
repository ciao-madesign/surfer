<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contatti · Surfer · Live</title>
<meta name="robots" content="index,follow">
<link rel="icon" href="/logo-mark.svg">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/colors_and_type.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/site.css">
<style>.form{max-width:560px}textarea{width:100%;min-height:140px;background:var(--wt-panel);color:inherit;border:1px solid var(--wt-border);border-radius:8px;padding:10px;font:inherit;resize:vertical}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}#res{margin-top:12px}#res.ok{color:var(--wt-ok)}#res.err{color:var(--wt-error)}</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="brand" href="/"><img src="/img/wiztrail-logo.png" alt="" width="36" height="36">Surfer · Live</a><a class="btn" href="/">Home</a></header>
  <main class="prose form">
    <h1>Contatti</h1>
    <p>Domande, segnalazioni o richieste sui tuoi dati: scrivici da qui. Rispondiamo all'indirizzo che indichi.</p>
    <form id="f" novalidate>
      <label for="topic">Argomento</label>
      <select id="topic"><option value="domanda">Domanda</option><option value="segnalazione">Segnalazione di un problema</option><option value="privacy">Privacy e cancellazione dei dati</option></select>
      <label for="name">Nome (facoltativo)</label><input id="name" maxlength="80" autocomplete="name">
      <label for="email">Email per la risposta (facoltativa, ma senza non possiamo risponderti)</label><input id="email" type="email" maxlength="200" autocomplete="email">
      <label for="message">Messaggio</label><textarea id="message" maxlength="3000" required></textarea>
      <div class="hp" aria-hidden="true"><label>Non compilare<input id="website" tabindex="-1" autocomplete="off"></label></div>
      <p class="small muted">Il messaggio viene inviato per email e non viene salvato sul sito. Dettagli nell'<a href="/privacy">informativa privacy</a>.</p>
      <button class="primary" id="send" type="submit">Invia</button>
      <div id="res" role="status"></div>
    </form>
  </main>
  <footer class="foot"><a href="/">Torna alla home</a></footer>
</div>
<script>
const $ = (id) => document.getElementById(id);
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = $('res'); res.className = ''; res.textContent = '';
  $('send').disabled = true;
  try {
    const r = await fetch('/api/contact', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ topic: $('topic').value, name: $('name').value, email: $('email').value, message: $('message').value, website: $('website').value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Invio non riuscito');
    res.className = 'ok'; res.textContent = 'Messaggio inviato, grazie.'; $('f').reset();
  } catch (err) { res.className = 'err'; res.textContent = err.message; }
  $('send').disabled = false;
});
</script>
</body>
</html>
